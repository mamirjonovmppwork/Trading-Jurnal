<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ==================== MAVZU (oq chaqnashga yo'l qo'ymaslik) ====================
         CSS yuklanishidan OLDIN bajariladi: <html> ga data-theme qo'yiladi,
         shuning uchun sahifa darhol to'g'ri rangda chiziladi.
         js/theme.js bu qiymatni keyinchalik boshqaradi. -->
    <script>
      (function () {
        try {
          var p = localStorage.getItem('theme');
          if (p !== 'light' && p !== 'dark' && p !== 'system') p = 'system';
          var dark = p === 'dark' ||
            (p === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var r = document.documentElement;
          r.setAttribute('data-theme', dark ? 'dark' : 'light');
          r.setAttribute('data-theme-pref', p);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <title>Trading Jurnal — profilni to'ldirish</title>

    <!-- ==================== BREND / FAVICON ====================
         Fayllar: Frontend/brand/ (README.md da ro'yxati bor) -->
    <link rel="icon" href="brand/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="brand/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="brand/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="brand/apple-touch-icon.png">
    <meta name="theme-color" content="#2563EB">

    <!-- ==================== OPEN GRAPH / TWITTER ====================
         Telegram, Instagram va boshqa joylarda havola ulashilganda
         chiroyli kartochka chiqishi uchun.
         Diqqat: og:image MUTLAQ manzil bo'lishi shart - ko'p kraulerlar
         nisbiy yo'lni yechmaydi. Domen o'zgarsa shu manzil ham
         almashtirilishi kerak. -->
    <meta name="description" content="Treyding profilingizni to'ldiring - statistika aniqroq hisoblanadi.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Trading Jurnal">
    <meta property="og:locale" content="uz_UZ">
    <meta property="og:url" content="https://trading-jurnal-two.vercel.app/profile-setup.html">
    <meta property="og:title" content="Trading Jurnal - profilni to'ldirish">
    <meta property="og:description" content="Treyding profilingizni to'ldiring - statistika aniqroq hisoblanadi.">
    <meta property="og:image" content="https://trading-jurnal-two.vercel.app/brand/og-image.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Trading Jurnal - savdo jurnali va tahlil platformasi">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Trading Jurnal - profilni to'ldirish">
    <meta name="twitter:description" content="Treyding profilingizni to'ldiring - statistika aniqroq hisoblanadi.">
    <meta name="twitter:image" content="https://trading-jurnal-two.vercel.app/brand/og-image.png">
    <!-- theme.css BIRINCHI: qolgan CSS fayllar shu yerdagi
         var(--...) tokenlariga tayanadi -->
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/media.css">
    <link rel="stylesheet" href="css/forms.css">
    <script src="https://unpkg.com/lucide@1.62.0"></script>
</head>
<body class="auth-page">
    <div class="auth-container auth-wide card">

        <div class="auth-icon-wrapper">
            <i data-lucide="user-round-cog"></i>
        </div>

        <a href="index.html" class="auth-logo" aria-label="Trading Jurnal">
            <img src="brand/logo-light.svg" data-logo alt="Trading Jurnal" width="190" height="40" class="brand-logo">
        </a>

        <h2>Profilingizni To'ldiring</h2>
        <p class="auth-subtitle">
            <span id="ps-greeting"></span>Bu ma'lumotlar statistikani aniqroq
            hisoblash uchun kerak. Hammasi ixtiyoriy — keyinroq ham to'ldirishingiz mumkin.
        </p>

        <div class="form-alert error" id="ps-alert">
            <i data-lucide="alert-circle"></i>
            <span id="ps-alert-text"></span>
        </div>

        <form id="profile-setup-form" novalidate>

            <!-- Markup js/profile-fields.js da — register va Sozlamalar
                 bilan bir xil maydon to'plami -->
            <div id="profile-sections"></div>

            <button type="submit" class="submit-btn" id="ps-submit">
                <span>Saqlash va davom etish</span> <i data-lucide="arrow-right"></i>
            </button>
        </form>

        <button type="button" class="skip-link" id="ps-skip"
                style="background:none;border:none;cursor:pointer;font-family:inherit;margin-top:12px;">
            <span>Keyinroq to'ldiraman</span> <i data-lucide="arrow-right"></i>
        </button>
    </div>

    <script type="module" src="js/profile-setup.js"></script>
    <!-- Mavzu: logo almashtirish, tizim sozlamasini kuzatish, tez
         almashtirish tugmalari. data-theme ni esa <head> dagi inline
         skript allaqachon qo'ygan. -->
    <script type="module">
      import { initTheme } from './js/theme.js';
      initTheme();
    </script>
</body>
</html>

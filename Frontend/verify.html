<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Tasdiqlash</title>

    <!-- ==================== BREND / FAVICON ====================
         Fayllar: Frontend/brand/ (README.md da ro'yxati bor) -->
    <link rel="icon" href="brand/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="brand/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="brand/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="brand/apple-touch-icon.png">
    <meta name="theme-color" content="#2563EB">

    <!-- ==================== OPEN GRAPH / TWITTER ====================
         Telegram, Instagram va boshqa joylarda havola ulashilganda
         chiroyli kartochka chiqishi uchun.
         Diqqat: og:image MUTLAQ manzil bo'lishi shart - ko'p kraulerlar
         nisbiy yo'lni yechmaydi. Domen o'zgarsa shu manzil ham
         almashtirilishi kerak. -->
    <meta name="description" content="Emailingizga yuborilgan 6 xonali kodni kiriting.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Trading Jurnal">
    <meta property="og:locale" content="uz_UZ">
    <meta property="og:url" content="https://trading-jurnal-two.vercel.app/verify.html">
    <meta property="og:title" content="Trading Jurnal - emailni tasdiqlash">
    <meta property="og:description" content="Emailingizga yuborilgan 6 xonali kodni kiriting.">
    <meta property="og:image" content="https://trading-jurnal-two.vercel.app/brand/og-image.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Trading Jurnal - savdo jurnali va tahlil platformasi">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Trading Jurnal - emailni tasdiqlash">
    <meta name="twitter:description" content="Emailingizga yuborilgan 6 xonali kodni kiriting.">
    <meta name="twitter:image" content="https://trading-jurnal-two.vercel.app/brand/og-image.png">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/media.css">
    <link rel="stylesheet" href="css/forms.css">
    <script src="https://unpkg.com/lucide@1.62.0"></script>
</head>
<body class="auth-page">
    <div class="auth-container card text-center">

        <div class="steps-bar">
            <span class="step-dot done">1</span>
            <span class="step-line done"></span>
            <span class="step-dot active">2</span>
        </div>

        <div class="auth-icon-wrapper">
            <i data-lucide="mail-check"></i>
        </div>

        <a href="index.html" class="auth-logo" aria-label="Trading Jurnal">
            <img src="brand/logo-light.svg" alt="Trading Jurnal" width="190" height="40" class="brand-logo">
        </a>

        <!-- ================= KOD KIRITISH ================= -->
        <div class="step-panel active" id="panel-code">
            <h2>Emailni Tasdiqlang</h2>
            <p class="code-target">
                Tasdiqlash kodi yuborildi:<br>
                <strong id="vf-email">—</strong>
            </p>
            <p class="auth-subtitle" style="margin-bottom:18px;">
                Pochtangizga kelgan 6 xonali kodni kiriting.
            </p>

            <div class="form-alert error" id="vf-alert">
                <i data-lucide="alert-circle"></i>
                <span id="vf-alert-text"></span>
            </div>

            <div class="code-boxes" id="code-boxes">
                <input class="code-box" type="text" inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="1-raqam">
                <input class="code-box" type="text" inputmode="numeric" maxlength="1" aria-label="2-raqam">
                <input class="code-box" type="text" inputmode="numeric" maxlength="1" aria-label="3-raqam">
                <input class="code-box" type="text" inputmode="numeric" maxlength="1" aria-label="4-raqam">
                <input class="code-box" type="text" inputmode="numeric" maxlength="1" aria-label="5-raqam">
                <input class="code-box" type="text" inputmode="numeric" maxlength="1" aria-label="6-raqam">
            </div>

            <button type="button" class="submit-btn" id="vf-submit">
                <span>Tasdiqlash</span> <i data-lucide="shield-check"></i>
            </button>

            <div class="code-actions">
                <button type="button" class="btn-text" id="vf-resend">
                    Kodni qayta yuborish
                </button>
                <button type="button" class="btn-text muted" id="vf-change-email">
                    Emailni o'zgartirish
                </button>
            </div>
        </div>

        <!-- ============== EMAILNI O'ZGARTIRISH ============== -->
        <div class="step-panel" id="panel-email">
            <h2>Emailni O'zgartirish</h2>
            <p class="auth-subtitle">
                Yangi email manzilini kiriting — tasdiqlash kodi shu manzilga yuboriladi.
            </p>

            <div class="form-alert error" id="ce-alert">
                <i data-lucide="alert-circle"></i>
                <span id="ce-alert-text"></span>
            </div>

            <div class="form-group">
                <label for="new-email">Yangi email</label>
                <div class="input-wrapper">
                    <i data-lucide="mail" class="input-icon"></i>
                    <input type="email" id="new-email" placeholder="example@mail.com" autocomplete="email">
                </div>
                <span class="field-error" id="err-new-email"></span>
            </div>

            <button type="button" class="submit-btn" id="ce-submit">
                <span>Kod yuborish</span> <i data-lucide="send"></i>
            </button>

            <div class="code-actions">
                <button type="button" class="btn-text muted" id="ce-back">
                    Orqaga
                </button>
            </div>
        </div>

        <div class="auth-footer">
            <p>Boshqa hisobga kirmoqchimisiz? <a href="login.html" id="vf-logout">Kirish</a></p>
        </div>
    </div>

    <script type="module" src="js/verify.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Tasdiqlash</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/media.css">
    <script src="https://unpkg.com/lucide@1.62.0"></script>
    <style>
        .vf-error {
            display: none;
            color: #f43f5e;
            font-size: 13px;
            margin-bottom: 14px;
        }
    </style>
</head>
<body class="auth-page">
    <div class="auth-container card text-center">
        <div class="step-indicator">Qadam 1 / 2</div>
        
        <div class="auth-icon-wrapper">
            <i data-lucide="mail-check"></i>
        </div>
        <h2>Emailni Tasdiqlash</h2>
        <p class="auth-subtitle">
            Tasdiqlash kodini olish yoki ushbu bosqichni o'tkazib yuborish uchun tugmani bosing.
        </p>
        
        <div class="vf-error" id="vf-error"></div>

        <button id="verify-btn" class="submit-btn">
            <span>Emailni Tasdiqlash</span> <i data-lucide="shield-check"></i>
        </button>

        <button id="skip-btn" class="skip-link" style="background: none; border: none; cursor: pointer; font-family: inherit;">
            <span>O'tkazib yuborish</span> <i data-lucide="arrow-right"></i>
        </button>
    </div>

    <!-- api.js ES module — shuning uchun bu skript ham type="module" bo'lishi shart -->
    <script type="module">
        import api from './js/api.js';

        lucide.createIcons();

        // Papka strukturasini buzmasdan to'g'ri yo'naltirish funksiyasi
        function safeRedirect(page) {
            const path = window.location.pathname;
            if (path.includes('/Frontend/')) {
                window.location.href = `/Frontend/${page}`;
            } else {
                window.location.href = page;
            }
        }


        function showError(msg) {
            const el = document.getElementById('vf-error');
            if (el) {
                el.innerText = msg;
                el.style.display = 'block';
            }
        }

        function hideError() {
            const el = document.getElementById('vf-error');
            if (el) el.style.display = 'none';
        }

        function setLoading(isLoading) {
            const btn = document.getElementById('verify-btn');
            if (!btn) return;
            btn.disabled = isLoading;
            btn.innerHTML = isLoading
                ? `<span class="btn-spinner"></span> <span>Tasdiqlanmoqda...</span>`
                : `<span>Emailni Tasdiqlash</span> <i data-lucide="shield-check"></i>`;
            if (!isLoading && window.lucide) lucide.createIcons();
        }

        /**
         * Tasdiqlashni serverda belgilaydi va keyingi qadamga o'tadi.
         *
         * ❗ "O'tkazib yuborish" ham AYNAN SHU so'rovni yuboradi. Sababi:
         *    dashboard endi faqat serverdagi isVerified ga tayanadi, shuning uchun
         *    serverda flag qo'yilmasa foydalanuvchi verify -> onboarding -> dashboard
         *    -> verify halqasiga tushib qoladi. Backend'da haqiqiy email tasdiqlash
         *    (kod yuborish) yo'q — /auth/verify shunchaki flagni true qiladi —
         *    shuning uchun "tasdiqlash" va "o'tkazib yuborish" amalda bir xil.
         */
        async function markVerified() {
            setLoading(true);
            hideError();
            try {
                const res = await api.post('/auth/verify', {});
                safeRedirect(res?.isOnboarded === true ? 'dashboard.html' : 'onboarding.html');
            } catch (err) {
                console.error('Verify xatoligi:', err);
                showError(err?.message || 'Tasdiqlashda xatolik yuz berdi. Qaytadan urinib ko\'ring.');
                setLoading(false);
            }
        }

        document.getElementById('verify-btn').addEventListener('click', markVerified);
        document.getElementById('skip-btn').addEventListener('click', markVerified);
    </script>
</body>
</html>
